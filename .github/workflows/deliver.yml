name: Deliver orders

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"   # every 10 minutes, off the busy :00 slots
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      send_test:
        description: "Send a test delivery to the owner instead of checking payments"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: deliver
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest && pytest -q

  deliver:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MONO_TOKEN: ${{ secrets.MONO_TOKEN }}
      GMAIL_ADDRESS: andrew.kamyshin@gmail.com
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      PRODUCT_PATH: /tmp/product.md
      SEND_TEST: ${{ github.event.inputs.send_test == 'true' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unlock product file
        if: env.GMAIL_APP_PASSWORD != ''
        run: |
          KEY="${GMAIL_APP_PASSWORD// /}" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in delivery/product.enc -out /tmp/product.md -pass env:KEY
      - name: Check orders and deliver
        run: python delivery/deliver.py
      - name: Save state
        run: |
          git config user.name "ship-it-bot"
          git config user.email "ship-it-bot@users.noreply.github.com"
          git add state/processed.json
          git diff --cached --quiet || (git commit -m "state: delivered orders" && git pull --rebase && git push)
      - name: Queue the next check (backup for GitHub's unreliable cron)
        if: always() && env.SEND_TEST != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 420
          others=$(gh api "repos/${{ github.repository }}/actions/workflows/deliver.yml/runs?per_page=10" \
            --jq '[.workflow_runs[] | select(.status != "completed" and .id != ${{ github.run_id }})] | length')
          if [ "$others" = "0" ]; then
            gh api -X POST "repos/${{ github.repository }}/actions/workflows/deliver.yml/dispatches" -f ref=main
            echo "next check queued"
          else
            echo "another check is already queued"
          fi
