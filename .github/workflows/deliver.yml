name: Deliver orders

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: deliver
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check orders and deliver
        env:
          MONO_TOKEN: ${{ secrets.MONO_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PRODUCT_B64: ${{ secrets.PRODUCT_B64 }}
        run: python delivery/deliver.py
      - name: Save state
        run: |
          git config user.name "ship-it-bot"
          git config user.email "ship-it-bot@users.noreply.github.com"
          git add state/processed.json
          git diff --cached --quiet || (git commit -m "state: delivered orders" && git push)

  tests:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest && pytest -q
